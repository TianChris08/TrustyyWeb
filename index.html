<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi historia</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:#07060C;color:#F2EEF8;font:17px/1.65 'Instrument Sans',system-ui,sans-serif;overflow-x:hidden;--l1:#16E0D0;--l2:#4F5BFF;--l3:#9B5CFF}
body[data-m="glacier"]{--l1:#7FD8FF;--l2:#3A7BFF;--l3:#E6F4FF}
body[data-m="nightfall"]{--l1:#6C5CFF;--l2:#2D9CDB;--l3:#B9C6FF}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.lights{position:fixed;inset:-10%;z-index:0;pointer-events:none}
.o{position:absolute;border-radius:50%;filter:blur(110px);opacity:.32;animation:drift 30s ease-in-out infinite alternate}
.o1{width:44vmax;height:44vmax;left:-8%;top:6%;background:var(--l1)}
.o2{width:36vmax;height:36vmax;right:-6%;top:34%;background:var(--l2)}
.o3{width:26vmax;height:26vmax;left:40%;bottom:-8%;background:var(--l3);opacity:.22}
@keyframes drift{to{transform:translate(6vmax,-4vmax) scale(1.1)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 22px}
.glass{background:rgba(16,12,26,.62);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1.5px solid rgba(255,255,255,.6);border-radius:6px 26px 6px 26px}
header.site{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin:22px 0 0;padding:12px 24px}
.logo{font:800 20px 'Unbounded',sans-serif;letter-spacing:-.02em;background:none;border:0;padding:0}
nav{display:flex;gap:6px 20px;flex-wrap:wrap}
nav button{background:none;border:0;padding:2px 0;opacity:.75;border-bottom:2px solid transparent}
nav button:hover{opacity:1}
nav button[aria-current="page"]{opacity:1;border-color:#fff}
h1,h2,h3{font-family:'Unbounded',sans-serif;letter-spacing:-.03em;margin:0}
.hero{padding:80px 0 44px}
.hero h1{font-weight:800;font-size:clamp(36px,8vw,96px);line-height:.95}
.hero h1 span{display:block;font-weight:300;color:transparent;-webkit-text-stroke:1.5px #fff}
.hero p,.lead{max-width:50ch;font-size:19px;color:#DAD3EA;margin:28px 0 0}
.ph{padding:56px 0 28px}
.ph h1{font-size:clamp(32px,6vw,60px);font-weight:800;line-height:1}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;padding-bottom:70px}
.card{grid-column:span 2;text-align:left;padding:26px;display:flex;flex-direction:column;gap:10px}
.card.w3{grid-column:span 3}
.card h3{font-size:19px;font-weight:600;line-height:1.2}
.card p{margin:0;color:#D0C8E2;font-size:16px}
.go{margin-top:auto;padding-top:8px;font-weight:600;color:#fff}
button.card:hover{border-color:#fff}
.chip{align-self:flex-start;font-size:13px;padding:2px 12px;border:1px solid rgba(255,255,255,.5);border-radius:99px}
.tl{list-style:none;margin:0;padding:0 0 70px;display:grid;gap:22px}
.tl li{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:26px}
.tl .yr{font:300 28px 'Unbounded',sans-serif;letter-spacing:-.03em}
.tl h3{font-size:20px;margin-bottom:8px}
.tl p{margin:0;max-width:62ch;color:#D8D0E8;white-space:pre-wrap}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px}
.ch h3{grid-column:1/-1;font-size:21px}
.ch b{display:block;font-size:14px;color:#B7ADCB;font-weight:600;margin-bottom:2px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:70px}
.pic{padding:10px;display:grid;gap:10px;margin:0}
.pic i,.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px 18px 3px 18px}
.pic i{background:linear-gradient(135deg,var(--l1),var(--l2) 60%,var(--l3));opacity:.8}
.pic span{padding:0 6px 6px;font-size:15px;color:#D8D0E8}
.feed{display:grid;gap:18px;max-width:680px;padding-bottom:70px}
.th{padding:22px 24px;display:grid;gap:8px}
.th p{margin:0;white-space:pre-wrap}
.meta{font-size:14px;color:#B7ADCB}
.th.poem p{font:300 19px/1.7 'Unbounded',sans-serif;letter-spacing:-.01em}
.th.mad p{font-weight:600;font-size:19px}
#err{margin:80px 0;padding:26px}
footer{padding:10px 0 50px;color:#B7ADCB}
@media(prefers-reduced-motion:reduce){.o{animation:none}}
@media(max-width:820px){.card,.card.w3{grid-column:1/-1}.tl li{grid-template-columns:1fr;gap:6px}.ch{grid-template-columns:1fr}.pics{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.pics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="lights"><div class="o o1"></div><div class="o o2"></div><div class="o o3"></div></div>
<div class="wrap">
  <header class="site glass"><button class="logo" id="logo"></button><nav id="nav"></nav></header>
  <div id="err" class="glass" hidden>No se pudo cargar <b>data.json</b>. Si abriste el archivo con doble clic, es normal: el navegador lo bloquea. Funciona al subirlo a GitHub Pages.</div>
  <main id="views"></main>
  <footer id="foot"></footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPES={thought:"Pensamiento",poem:"Poema",mad:"Momento de rabia"};
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(init).catch(()=>{$("#err").hidden=false});

function init(d){
  const s=d.site,sec=d.sections,keys=Object.keys(sec);
  document.body.dataset.m=s.theme||"abyss";
  document.title=s.name;
  $("#logo").textContent=s.name;
  $("#foot").textContent=s.footer||"";
  $("#nav").innerHTML=[["home","Inicio"],...keys.map(k=>[k,sec[k].name])].map(([k,l])=>`<button data-go="${k}">${esc(l)}</button>`).join("");
  const head=k=>`<div class="ph"><h1>${esc(sec[k].name)}</h1><p class="lead">${esc(sec[k].desc)}</p></div>`;
  const V={
    home:`<div class="hero"><h1>${esc(s.title)}<span>${esc(s.subtitle)}</span></h1><p>${esc(s.intro)}</p></div><div class="grid">${keys.map((k,i)=>`<button class="card glass${i>2?" w3":""}" data-go="${k}"><h3>${esc(sec[k].name)}</h3><p>${esc(sec[k].desc)}</p><span class="go">Abrir</span></button>`).join("")}</div>`,
    story:head("story")+`<ol class="tl">${(d.story||[]).map(x=>`<li class="glass"><div class="yr">${esc(x.year)}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div></li>`).join("")}</ol>`,
    challenges:head("challenges")+`<div class="grid">${(d.challenges||[]).map(x=>`<article class="card w3 glass ch"><h3>${esc(x.title)}</h3><div><b>Qué pasó</b><p>${esc(x.happened)}</p></div><div><b>Qué me ayudó</b><p>${esc(x.helped)}</p></div></article>`).join("")}</div>`,
    projects:head("projects")+`<div class="grid">${(d.projects||[]).map(x=>`<article class="card glass"><span class="chip">${esc(x.tag)}</span><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p>${/^https?:\/\//.test(x.link||"")?`<a class="go" href="${esc(x.link)}" target="_blank" rel="noopener">Ver proyecto</a>`:""}</article>`).join("")}</div>`,
    memories:head("memories")+`<div class="pics">${(d.memories||[]).map(x=>`<figure class="pic glass">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.caption)}" loading="lazy">`:"<i></i>"}<span>${esc(x.caption)}</span></figure>`).join("")}</div>`,
    thoughts:head("thoughts")+`<div class="feed">${(d.thoughts||[]).map(x=>`<article class="th glass ${esc(x.type||"thought")}"><div class="meta">${esc(TYPES[x.type]||TYPES.thought)} · ${esc(x.date)}</div><p>${esc(x.text)}</p></article>`).join("")}</div>`
  };
  $("#views").innerHTML=Object.keys(V).map(k=>`<section id="v-${k}" hidden>${V[k]}</section>`).join("");
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;scrollTo(0,0)});
  const show=()=>{
    const k=location.hash.slice(1)in V?location.hash.slice(1):"home";
    Object.keys(V).forEach(x=>$("#v-"+x).hidden=x!==k);
    document.querySelectorAll("#nav button").forEach(b=>b.dataset.go===k?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  };
  $("#logo").dataset.go="home";$("#logo").onclick=()=>{location.hash="home"};
  addEventListener("hashchange",show);show();
}
</script>
</body>
</html>
